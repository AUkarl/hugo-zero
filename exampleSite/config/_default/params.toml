# --------------------------------------------
# 12. 邮件页面（/email/）
# --------------------------------------------
# 邮件登录页配置，包括邮箱跳转地址和 API 接口。

[email]
  enable = false                     # 是否启用邮件页面
  mail_domain = "mail.example.com"  # 登录成功后跳转的邮箱域名

  # --- 第三方登录 ---
  # 支持的提供商: github / google
  third_party_login = ["github", "google"]

  # --- 登录/注册 API 接口 ---
  # SkyMail API 文档: POST /api/login 登录, POST /api/user/add 注册（需注册码）
  [email.api]
    enabled = true                  # 是否启用 API 验证（false=仅跳转，不验证）
    base_url = "https://mail-api.example.com"  # API 基础 URL
    login_endpoint = "/api/login"   # 登录: POST {email, password} → {data: {token}}
    register_endpoint = "/api/user/add"  # 注册: POST {email, password}（管理员接口，需注册码）
    redirect_url = ""               # 登录成功后跳转地址（留空则使用 mail_domain）
    success_code = 200              # 成功状态码（响应 JSON 中的 code 字段）


# --------------------------------------------
# 13. 工具页面（/tools/）
# --------------------------------------------
# 工具页开关，工具数据从 data/tools.yaml 读取。

[tools]
  enable = true                     # 是否启用工具页面

