# ============================================================
# params.toml — Moonlight Minimal 主题完整配置文件
# ============================================================
#
# 本文件是主题的全部可配置项汇总。
# 所有参数均有详细注释，按编号分区，方便查找和修改。
#
# 使用方式：
#   1. 根据需要修改各项参数值
#   2. 运行 hugo server 预览效果
#
# 注意事项：
#   - 字符串值用双引号包裹，如 "hello"
#   - 布尔值直接写 true / false（不加引号）
#   - 数组用方括号，如 ["a", "b"]
#   - 空字符串 "" 表示该功能未配置/未启用
#   - 修改后需重启 hugo server 才能生效
#
# ============================================================


# --------------------------------------------
# 1. 站点基本信息
# --------------------------------------------
# 控制网站 Logo、名称、作者的全局显示与多语言文本。

# --- Logo ---
show_logo = true                    # 是否显示 Logo（true=显示 / false=隐藏）
logo = "/img/logo.svg"              # Logo 图片路径（相对于 static 目录）
logo_zh = "/img/logo.svg"           # 中文 Logo（留空则使用 logo）
logo_en = "/img/logo.svg"           # 英文 Logo（留空则使用 logo）

# --- 网站名称 ---
show_site_name = true               # 是否在导航栏显示网站名称
site_name = "示例站点"              # 网站名称（默认显示）
site_name_zh = "示例站点"           # 中文名称（留空则使用 site_name）
site_name_en = "Example Site"       # 英文名称（留空则使用 site_name）

# --- 作者 ---
show_author = true                  # 是否显示全局作者信息
author = "示例作者"                 # 默认作者名
author_zh = "示例作者"              # 中文作者名（留空则使用 author）
author_en = "Example Author"        # 英文作者名（留空则使用 author）
default_author = "default"           # 文章默认作者 ID（对应 data/authors.yaml 中的 key）

# --- 其他 ---
description = "一个使用 zero 主题搭建的示例站点。"     # 站点描述（用于 SEO）
keywords = ["blog", "hugo", "theme", "示例站点", "个人博客"]  # 站点关键词（数组）
favicon = "/img/logo.svg"         # 网站图标路径（相对于 static 目录，留空使用默认）

# --- 关于页 / 时刻页 / 作者栏共用的头像与昵称 ---
# 注意：这两个键必须写在所有 [表] 之前（TOML 规则：出现表头后，裸键都会归到那张表里），
# 否则会被并进 [[about.declaration]] 变成无效配置，主题就退回它自带的默认值。
aboutAvatar = "img/avatar.svg"   # 头像路径（相对于 static 目录）
aboutName = "示例作者"            # 显示名称


# --------------------------------------------
# 2. 导航栏
# --------------------------------------------
# 控制导航栏的显示行为、主题切换、语言切换。
# 导航菜单项在 menus.toml 中配置。

enable_theme_switch = true          # 是否显示主题切换按钮（暗色/亮色/跟随系统）
enable_lang_switch = true           # 是否显示语言切换按钮（中/英）

# 当主题切换关闭时，选择默认主题模式
# 可选值: "auto"（跟随系统）/ "light"（亮色）/ "dark"（暗色）
# 仅当 enable_theme_switch = false 时生效
default_theme = "auto"

# 导航栏显示名（留空则使用 site_name）
# navName_en 切换英文后显示的名称
navName = "示例站点"
navName_zh = "示例站点"
navName_en = "Example Site"


# --------------------------------------------
# 3. 首页 index 跳转页（/）
# --------------------------------------------
# 访问根路径时显示的诗词轮播页。

[landing]
  # --- 诗词轮播 ---
  show_quotes = true                # 是否显示诗词轮播
  quotes_zh = [
    "海上生明月 & 天涯共此时",
    "碧山幽人来 & 清酒酌满杯",
    "江南无所有 & 聊赠一枝春",
    "今夕复何夕 & 共此灯烛光",
    "相逢且同乐 & 何必旧相知",
    "不辞山路远 & 踏雪也相过"
  ]
  quotes_en = [
    "The moon rises over the sea, we share this moment",
    "A hermit comes from the green hills, wine cups filled",
    "In the south I have nothing to give, but a spring branch",
    "What night is tonight, together by this candlelight",
    "Let us rejoice together, why must we be old friends?",
    "I'll not fear the mountain road, even through snow I'll come"
  ]

  # --- 欢迎语 ---
  show_welcome = true               # 是否显示欢迎语
  welcome_zh = "Hey，好久不见"       # 中文欢迎语
  welcome_en = "Hey, long time no see"  # 英文欢迎语

  # --- 背景图片 ---
  show_background = true            # 是否显示背景图片
  background_image = "img/bj.jpg"  # 背景图片路径（相对于 static 目录）


# --------------------------------------------
# 4. 主页 home（/home/）
# --------------------------------------------
# 文章卡片列表页的显示配置。

[home]
  layout = "bento"                # 主页布局：bento = 新版；grid = 旧版卡片网格
  paginate = 20                     # 每页最多显示文章数量
  columns = 4                       # 卡片列数（1-4）
  stagger_offset = 22               # 第 2、4 列整体下移 = 卡片宽度的百分比（随屏幕等比缩放；0 = 不错落）
  image_ratio = "4 / 3"             # 封面图统一比例，写成 "宽 / 高"（4 / 3、1 / 1、16 / 9）
  title_lines = 2                   # 标题固定行数（超出显示省略号）
  width_ratio = 90                  # 内容区域宽度占比（1-100，100=全宽）
  mainSections = ["posts"]
  show_images = true                # 是否显示文章封面图
  show_summary = true               # 是否显示文章摘要
  summary_length = 120              # 摘要最大字数（旧参数：中/英文没单独配置时的回退值）
  summary_length_zh = 120           # 中文摘要截断字数
  summary_length_en = 220           # 英文摘要截断字符数（英文单词更长，一般给大一些）
  summary_lines_zh = 3              # 中文摘要固定显示行数（超出省略号）
  summary_lines_en = 3              # 英文摘要固定显示行数

  # 主页描述文字（显示在页面标题下方）
  show_desc = true                  # 是否显示主页描述
  desc_zh = "这里是示例站点的首页说明。"
  desc_en = "Home page description of the example site."



# --------------------------------------------
# 5. 文章详情页
# --------------------------------------------
# 控制文章正文页面的显示元素。

[article]
  show_toc = true                   # 是否显示目录（Table of Contents）
  toc_levels = ["h2", "h3"]        # 目录包含的标题层级
  show_word_count = true            # 是否显示字数统计
  show_author_box = true            # 是否显示作者信息框
  show_license = true               # 是否显示 CC 许可协议
  donate_max_qr = 3                 # 赞赏弹窗最多显示二维码数量


# --------------------------------------------
# 5b. 数学公式
# --------------------------------------------

math = true                         # 是否全局启用数学公式（KaTeX）


# --------------------------------------------
# 6. 归档页（/archive/）
# --------------------------------------------

[archive]
  group_by_year = true              # 是否按年份分组
  enable_tag_danmaku = true         # 是否启用弹幕标签云
  danmaku_lanes = 5                 # 弹幕轨道数

  # 归档页描述文字（显示在页面标题下方）
  show_desc = true                  # 是否显示归档页描述
  desc_zh = "所有文章按时间线归档。"
  desc_en = "All posts archived on a timeline."



# --------------------------------------------
# 7. 时刻页（/moments/）
# --------------------------------------------
# 两种模式：
#   online_publish = true  → 整页变为评论区（waline/twikoo/artalk），仅保留顶部横幅
#   online_publish = false → 展示手动上传的说说卡片（通过 Hugo 内容文件），无发布框和点赞

[moment]
  online_publish = true              # true=在线发布模式 / false=离线展示模式

  # === 在线发布模式配置 ===
  # 整个时刻页变为一个评论区，仅保留顶部横幅
  [moment.online]
    comment_provider = "waline"       # 选择: waline / twikoo / artalk

    # Waline — 基于 Leancloud 的评论系统
    # 文档: https://waline.js.org/
    waline_server_url = "https://waline.example.com"
    waline_emoji = ["https://cdn.jsdelivr.net/npm/@waline/emojis/weibo"]

    # Twikoo — 基于云开发的评论系统
    # 文档: https://twikoo.js.org/
    twikoo_env_id = "https://twikoo.example.com"                # 环境 ID（必填）
    twikoo_region = "ap-east-1"                # 区域（如 ap-shanghai / ap-guangzhou）

    # Artalk — 自托管评论系统（该系统未测试）
    # 文档: https://artalk.js.org/
    artalk_server = ""                # Artalk 服务端 URL（必填）
    artalk_site = "default"           # 站点名称

    # 在线模式横幅配置
    [moment.online.banner]
      show_background = true          # 是否显示背景图
      background_image = "img/bj2.jpg" # 背景图路径（相对于 static 目录）
      show_avatar = false              # 是否显示头像
      show_nickname = false            # 是否显示昵称
      nickname = "示例作者"              # 横幅显示的昵称
      show_signature = false           # 是否显示签名
      signature = "记录生活，分享感悟" # 横幅显示的签名文字

  # === 离线展示模式配置 ===
  # 展示通过 Hugo 内容文件手动上传的说说
  [moment.offline]
    comment_provider = "waline"             # 空=禁用评论, 或选: waline / twikoo / artalk
    paginate = 10                     # 每次加载的时刻数量（无限滚动）

    # Waline
    waline_server_url = "https://waline.example.com"
    waline_emoji = ["https://cdn.jsdelivr.net/npm/@waline/emojis/weibo"]

    # Twikoo
    twikoo_env_id = "https://twikoo.example.com"
    twikoo_region = "ap-east-1"

    # Artalk
    artalk_server = ""
    artalk_site = "default"

    # 离线模式横幅配置
    [moment.offline.banner]
      show_background = true          # 是否显示背景图
      background_image = "img/bj2.jpg" # 背景图路径

    # 离线模式默认资料（显示在横幅中）
    [moment.offline.profile]
      default_nickname = "示例昵称"   # 默认昵称
      default_avatar = "img/avatar.svg" # 默认头像路径
      show_avatar = true              # 是否显示头像
      show_nickname = true            # 是否显示昵称
      show_signature = true           # 是否显示签名
      signature = "记录生活，分享感悟"  # 签名文字


# --------------------------------------------
# 8. 评论系统（文章页）
# --------------------------------------------
# 支持 4 种评论提供商，设置 provider 选择对应系统。
# 时刻页评论配置请参见上方第 7 节 [moment] 部分。
# 只需填写所选提供商的配置项，其他留空即可。

[comment]
  enable = true                     # 是否启用评论功能（总开关）

  # --- 文章页评论 ---
  [comment.article]
    provider = "waline"             # 选择: waline / giscus / twikoo / artalk

    # Waline — 基于 Leancloud 的评论系统
    # 文档: https://waline.js.org/
    # 部署后可获得 serverURL，格式如 https://your-app.vercel.app
    waline_server_url = "https://waline.example.com"  # Waline 服务端 URL（必填）
    waline_emoji = ["https://cdn.jsdelivr.net/npm/@waline/emojis/weibo"]  # 表情包 CDN
    waline_visitor = true           # 是否启用访问量统计
    waline_comment_sorting = "latest"  # 评论排序: latest / oldest / hottest
    waline_pageview = true          # 是否启用浏览量统计

    # Giscus — 基于 GitHub Discussions 的评论系统
    # 配置工具: https://giscus.app/ （可视化获取以下所有 ID）
    giscus_repo = "your-username/your-repo"          # GitHub 仓库（格式: user/repo，需启用 Discussions）
    giscus_repo_id = "R_kgDOXXXXXXXX"                # 仓库 ID（从 giscus.app 获取）
    giscus_category = "Announcements"                 # Discussion 分类名
    giscus_category_id = "DIC_kwDOXXXXXXXXXXXX"       # 分类 ID（从 giscus.app 获取）
    giscus_mapping = "pathname"       # 页面映射方式: pathname / url / title / og:title
    giscus_label = "comment"          # Issue 标签

    # Twikoo — 基于云开发的评论系统
    # 文档: https://twikoo.js.org/
    # 在腾讯云开发控制台创建环境后获得 envId
    twikoo_env_id = "https://twikoo.example.com"                # 环境 ID（必填）
    twikoo_region = "ap-east-1"                # 区域（如 ap-shanghai / ap-guangzhou）

    # Artalk — 自托管评论系统
    # 文档: https://artalk.js.org/
    # 部署后获得服务端 URL
    artalk_server = ""                # Artalk 服务端 URL（必填，如 https://artalk.example.com）
    artalk_site = "default"           # 站点名称（在 Artalk 后台创建）


# --------------------------------------------
# 9. 网站统计
# --------------------------------------------
# 启用网站访问统计工具。

[analytics]
  enable_google = false             # 是否启用 Google Analytics
  google_ga_id = ""                 # Google Analytics ID（格式: G-XXXXXXXXXX）
  enable_baidu = false              # 是否启用百度统计
  baidu_site_id = ""                # 百度统计站点 ID


# --------------------------------------------
# 10. 页脚
# --------------------------------------------
# 页脚版权信息、服务链接、社交链接。

[footer]
  copyright_text = "2025-{year} Example"  # 版权文字（{year} 自动替换为当前年份）
  icp = ""                            # ICP 备案号（留空则不显示）

  # powered by 行（显示在 "designed by XXX" 下方）
  show_powered_by = true              # 是否显示 powered by 行
  powered_by_text = "Powered by Hugo & zero" # 自定义文字（可改为任意内容）

  # 技术服务链接（页脚中间区域）
  # 增减方法: 复制一个 [[footer.services]] 块并修改内容
  
  [[footer.services]]
    name = "Hugo"
    icon = "fa-brands fa-hugo"
    link = "https://gohugo.io/"
  [[footer.services]]
    name = "GitHub"
    icon = "fa-brands fa-github"
    link = "https://github.com/"
  [[footer.services]]
    name = "Cloudflare"
    icon = "fa-brands fa-cloudflare"
    link = "https://cloudflare.com"
  

  # 社交链接第一行
  # 增减方法: 复制一个 [[footer.social_row1]] 块并修改内容
  [[footer.social_row1]]
    name = "Instagram"
    icon = "fa-brands fa-instagram"
    link = "https://example.com"
  [[footer.social_row1]]
    name = "Twitter"
    icon = "fa-brands fa-twitter"
    link = "https://example.com"
  [[footer.social_row1]]
    name = "GitHub"
    icon = "fa-brands fa-github"
    link = "https://github.com/your-username"
  [[footer.social_row1]]
    name = "Email"
    icon = "fa-solid fa-envelope"
    link = "mailto:example@example.com"

  # 社交链接第二行
  # 增减方法: 复制一个 [[footer.social_row2]] 块并修改内容
  [[footer.social_row2]]
    name = "微博"
    icon = "fa-brands fa-weibo"
    link = "https://example.com"
  [[footer.social_row2]]
    name = "B站"
    icon = "fa-brands fa-bilibili"
    link = "https://example.com"
  [[footer.social_row2]]
    name = "知乎"
    icon = "fa-brands fa-zhihu"
    link = "https://example.com"
  [[footer.social_row2]]
    name = "RSS"
    icon = "fa-solid fa-rss"
    link = "/index.xml"


# --------------------------------------------
# 11. 关于页面（/about/）
# --------------------------------------------
# 控制关于页的各区域显示开关和内容编辑。

[about]
  enable = true                    # 是否启用关于页面
  show_avatar = true               # 是否显示头像
  show_name = true                 # 是否显示名称
  show_bio = true                  # 是否显示个人简介
  show_social = true               # 是否显示社交链接
  show_friends = true               # 是否显示友情链接
  show_declaration = true           # 是否显示站点声明
  show_supports = false             # 是否显示支持服务
  show_alliance = false             # 是否显示站点联盟
  show_site = true                 # 是否显示关于本站

  # 关于页描述（显示在页面标题下方）
  show_desc = true                  # 是否显示描述
  desc_zh = "示例站点的简介文字。"
  desc_en = "A short description of the example site."


  # 个性签名（显示在名称下方）
  tagline_zh = "示例个性签名。"
  tagline_en = "Example tagline."

  # --- 个人简介内容 ---
  # 增减方法: 复制一个 [[about.bio]] 块并修改内容（支持无限段落）
  [[about.bio]]
    text_zh = "你好，这里是示例作者。"
    text_en = "Hi, this is the example author."
  [[about.bio]]
    text_zh = "这是第二段示例简介，写点你愿意公开的内容即可。"
    text_en = "This is the second example paragraph. Write whatever you want to make public."
  [[about.bio]]
    text_zh = "这里支持简单的 Markdown 写法，段落数量随意增减。"
    text_en = "Simple Markdown works here, and you can add as many paragraphs as you like."

  # --- 关于本站内容 ---
  # 增减方法: 复制一个 [[about.site]] 块并修改内容（支持无限段落）
  [[about.site]]
    text_zh = "这是一个示例站点。"
    text_en = "This is an example site."
  [[about.site]]
    text_zh = "这一段用来介绍站点本身：为什么建、写些什么、多久更新一次。"
    text_en = "Use this paragraph to introduce the site itself: why it exists, what it covers, how often it updates."
  [[about.site]]
    text_zh = "本站使用开源的 Hugo 主题 `zero` 搭建，可自由替换为任何主题。"
    text_en = "This site is built with the open-source Hugo theme zero."

  # --- 站点声明内容 ---
  # 增减方法: 复制一个 [[about.declaration]] 块并修改内容（支持无限段落）
  [[about.declaration]]
    text_zh = "本站所有内容除特别声明外均采用CC BY-NC-SA许可协议，转载请注明出处。本站转载内容版权归原作者所有，如有任何问题请联系原作者。"
    text_en = "All content on this website, unless otherwise stated, is licensed under the CC BY-NC-SA (Creative Commons Attribution-NonCommercial-ShareAlike) license. Please give appropriate attribution when reusing.For any republished content, the copyright belongs to its original author(s). If you have any questions, please contact the original author(s) directly."
  [[about.declaration]]
    text_zh = "本站不主动收集用户数据。评论及时刻部分使用第三方评论系统，本站不与任何人共享有关信息，您有权要求删除您的评论。"
    text_en = "This website does not actively collect user data. The comments section and the moments feature are powered by a third‑party comment system. We do not share any related information with anyone. You have the right to request the deletion of your comments."
  [[about.declaration]]
    text_zh = "本站部分内容来自网络，如有侵权请联系删除。外部链接内容不代表本站观点。"
    text_en = "Some content on this website is sourced from the internet. If any content infringes upon your rights, please contact us for removal. The content of external links does not represent the views of this website."


# --- 友情链接列表 ---
# 增减方法: 复制一个 [[friends]] 块并修改内容
[[friends]]
