{{- /* ============================================================
  moments/single.html — 时刻详情页
  复用列表页那套朋友圈式结构（shuo-* 类），样式不用再写一遍；
  正文里的短代码媒体由 shuo.js 从 <template> 里拆出来渲染（与列表页同一套逻辑）
  ============================================================ */ -}}
{{- define "styles" -}}
{{- $momentsCSS := resources.Get "css/shuo.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $momentsCSS.RelPermalink }}">
{{- $shortcodeCSS := resources.Get "css/shortcodes.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $shortcodeCSS.RelPermalink }}">
{{- end -}}

{{- define "main" -}}
{{- $nickname := .Site.Params.aboutName | default "知 止" -}}
{{- $avatar := (.Site.Params.aboutAvatar | default "img/avatar.webp") | relURL -}}
{{- /* 链接卡片：支持 map（url/title/desc/image），也兼容直接写一个地址字符串 */ -}}
{{- $lk := .Params.link -}}
{{- $linkURL := "" -}}{{- $linkTitle := "" -}}{{- $linkDesc := "" -}}{{- $linkImg := "" -}}
{{- if reflect.IsMap $lk -}}
  {{- $linkURL = $lk.url | default "" -}}
  {{- $linkTitle = $lk.title | default "" -}}
  {{- $linkDesc = $lk.desc | default "" -}}
  {{- $linkImg = $lk.image | default "" -}}
{{- else -}}
  {{- $linkURL = $lk | default "" -}}
{{- end -}}
{{- $n := len (.Params.images | default slice) -}}
<main class="main" id="main">
  <section class="section">
    <div class="shuo-wrapper">
      <article class="shuo-item">
        <div class="shuo-avatar"><img src="{{ $avatar }}" alt="" loading="lazy"></div>
        <div class="shuo-body">
          <div class="shuo-name">{{ $nickname }}</div>
          <div class="shuo-content" hidden></div>
          <template class="shuo-raw">{{ .Content }}</template>

          {{- with .Params.images }}
          <div class="shuo-images count-{{ math.Min (len .) 9 }}">
            {{- range . }}
            {{- $sizes := "(max-width: 820px) 62vw, 420px" -}}
            {{- if gt $n 1 -}}{{- $sizes = "(max-width: 820px) 31vw, 200px" -}}{{- end -}}
            {{- $info := partial "img-src.html" (dict "src" . "page" $ "sizes" $sizes "widths" (slice 400 800)) -}}
            {{- $href := $info.orig | default . -}}
            <button type="button" class="shuo-img-link{{ if and (eq $n 1) (not (and $info.width $info.height)) }} no-ratio{{ end }}"
                    aria-label="{{ i18n "lightbox-view" | default "查看大图" }}"{{ if and (eq $n 1) $info.width $info.height }} style="aspect-ratio:{{ $info.width }} / {{ $info.height }}"{{ end }}>
              {{- if $info.ok }}
              <img class="shuo-img" data-src="{{ $info.src }}" data-srcset="{{ $info.srcset }}" sizes="{{ $info.sizes }}"{{ with $info.lqip }} style="background-image:url({{ . }});background-size:cover;background-position:center"{{ end }} alt="" decoding="async">
              {{- else }}
              <img class="shuo-img" src="{{ $href }}" alt="" loading="lazy">
              {{- end }}
            </button>
            {{- end }}
          </div>
          {{- end }}

          <div class="shuo-media" hidden></div>

          {{- with .Params.music }}
          <div class="shuo-music">
            <span class="shuo-music-cover">
              {{- with $.Params.music_cover }}<img src="{{ . }}" alt="" loading="lazy">{{ else }}<i class="fas fa-music" aria-hidden="true"></i>{{ end }}
            </span>
            <span class="shuo-music-info"><span class="shuo-music-title">{{ $.Params.music_title | default . }}</span></span>
            <button type="button" class="shuo-music-play" aria-label="播放"><i class="fas fa-play" aria-hidden="true"></i></button>
            <audio preload="none" src="{{ . }}"></audio>
          </div>
          {{- end }}

          {{- with .Params.video }}
          <div class="shuo-video-wrap">
            <video class="shuo-video" controls preload="metadata"{{ with $.Params.video_poster }} poster="{{ . }}"{{ end }} src="{{ . }}"></video>
          </div>
          {{- end }}

          {{- with $linkURL }}
          <a class="shuo-link" href="{{ . }}" target="_blank" rel="noopener">
            <span class="shuo-link-main">
              <span class="shuo-link-title">{{ $linkTitle | default . }}</span>
              {{- with $linkDesc }}<span class="shuo-link-desc">{{ . }}</span>{{ end }}
              <span class="shuo-link-host">{{ (urls.Parse .).Host }}</span>
            </span>
            {{- with $linkImg }}<span class="shuo-link-thumb"><img src="{{ . }}" alt="" loading="lazy"></span>{{ end }}
          </a>
          {{- end }}

          <div class="shuo-bar">
            <time class="shuo-time" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02 15:04" }}</time>
          </div>
        </div>
      </article>

      <div class="moment-back">
        <a href="{{ "moments/" | relLangURL }}" class="back-link">
          <i class="fas fa-arrow-left" aria-hidden="true"></i> {{ i18n "moments-back" | default "返回时刻" }}
        </a>
      </div>
    </div>
  </section>
</main>
{{- end -}}

{{- define "scripts" -}}
{{- /* 正文短代码媒体、音乐卡片播放、图片懒加载：复用列表页那套逻辑 */ -}}
{{- $shuoJS := resources.Get "js/shuo.js" | minify | fingerprint -}}
<script src="{{ $shuoJS.RelPermalink }}"></script>
{{- /* 图片点击放大查看 */ -}}
{{- $lbJS := resources.Get "js/lightbox.js" | minify | fingerprint -}}
<script src="{{ $lbJS.RelPermalink }}"
        data-close="{{ i18n "lightbox-close" | default "关闭" }}"
        data-prev="{{ i18n "lightbox-prev" | default "上一张" }}"
        data-next="{{ i18n "lightbox-next" | default "下一张" }}"
        data-view="{{ i18n "lightbox-view" | default "查看大图" }}"></script>
{{- end -}}
