{{- /* comments/artalk.html — Artalk 评论系统 */ -}}
<div id="artalk"></div>
<link href="https://cdn.jsdelivr.net/npm/artalk@2/dist/Artalk.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/artalk@2/dist/Artalk.js"></script>
<script>
  Artalk.init({
    el: '#artalk',
    pageKey: '{{ .page.RelPermalink }}',
    pageTitle: '{{ .page.Title }}',
    server: '{{ .cfg.artalk_server }}',
    site: '{{ .cfg.artalk_site | default "default" }}',
    locale: document.documentElement.lang || 'zh'
  });
</script>
