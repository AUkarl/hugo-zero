{{- /*
  bilibili.html — B站视频嵌入短代码
  用法: {{< bilibili "BV1xx411c7mD" >}}
  或:   {{< bilibili id="BV1xx411c7mD" page="2" >}}
  支持: BV 号、分P选择、自动播放
*/ -}}
{{- $id := .Get "id" | default (.Get 0) -}}
{{- $page := .Get "page" | default "1" -}}
{{- $danmaku := .Get "danmaku" | default "false" -}}
<div class="video-embed bilibili-embed">
  <iframe src="//player.bilibili.com/player.html?bvid={{ $id }}&page={{ $page }}&danmaku={{ $danmaku }}&high_quality=1"
    scrolling="no"
    border="0"
    frameborder="no"
    framespacing="0"
    allowfullscreen="true"
    loading="lazy"
    style="width:100%;aspect-ratio:16/9;height:auto;">
  </iframe>
</div>
