# ============================================================
# Decap CMS 配置
# 访问 /admin/ 进入后台管理
# ============================================================

backend:
  name: github
  repo: AUkarl/molyun
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: static/img/uploads
public_folder: /img/uploads

slug:
  encoding: "ascii"
  clean_accents: true

collections:
  # ── 文章（中文）──────────────────────────────
  - name: "posts_zh"
    label: "文章 (中文)"
    folder: "content/zh/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "副标题", name: "subtitle", widget: "string", required: false }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "分类", name: "categories", widget: "list", default: ["未分类"] }
      - { label: "标签", name: "tags", widget: "list", default: [] }
      - { label: "主图", name: "image", widget: "image", required: false }
      - { label: "摘要", name: "description", widget: "text", required: false }
      - { label: "作者", name: "author", widget: "string", default: "zhizhi" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  # ── 文章（英文）──────────────────────────────
  - name: "posts_en"
    label: "Posts (English)"
    folder: "content/en/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Categories", name: "categories", widget: "list", default: ["Uncategorized"] }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Author", name: "author", widget: "string", default: "zhizhi" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ── 时刻（中文）──────────────────────────────
  - name: "moments_zh"
    label: "时刻 (中文)"
    folder: "content/zh/moments"
    create: true
    fields:
      - { label: "内容", name: "text", widget: "text" }
      - { label: "日期", name: "date", widget: "datetime" }
      - label: "图片"
        name: "images"
        widget: "list"
        required: false
        field: { label: "URL", name: "url", widget: "string" }
      - { label: "音乐链接", name: "music", widget: "string", required: false }
      - { label: "视频链接", name: "video", widget: "string", required: false }

  # ── 时刻（英文）──────────────────────────────
  - name: "moments_en"
    label: "Moments (English)"
    folder: "content/en/moments"
    create: true
    fields:
      - { label: "Text", name: "text", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        field: { label: "URL", name: "url", widget: "string" }
      - { label: "Music URL", name: "music", widget: "string", required: false }
      - { label: "Video URL", name: "video", widget: "string", required: false }

  # ── 说明 ──────────────────────────────────────
  # 数据文件（tools.yaml, authors.yaml, works.yaml）
  # 由于 Decap CMS 不支持 YAML 顶级列表格式，
  # 这些数据文件需要直接编辑，而非通过 CMS 后台。
