# theme.toml — zero 主题元数据
# 定义主题的基本信息、作者、许可证、特性等

name = "zero"
license = "MIT"
licenselink = "https://github.com/AUkarl/hugo-zero/blob/main/LICENSE"
description = "一个极简风格的 Hugo 个人站点主题，支持中英双语、暗色模式、时刻页双模式（在线评论/离线展示）、弹幕标签云归档等功能。"
homepage = "https://github.com/AUkarl/hugo-zero"
tags = ["blog", "minimal", "responsive", "dark-mode", "i18n", "personal", "portfolio", "comments", "waline", "twikoo", "artalk", "giscus", "moments"]
features = ["minimalist-design", "dark-mode", "bilingual", "moments-dual-mode", "math-support", "shortcodes", "responsive", "seo", "analytics"]
min_version = "0.100.0"

[author]
  name = "知止"
