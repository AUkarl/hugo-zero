  url = "/moments/"
  weight = 2

[[main]]
  name = "blog"
  url = "https://blog.example.com"
  weight = 3
  [main.params]
    external = true

[[main]]
  name = "work"
  url = "/work/"
  weight = 4

[[main]]
  name = "archive"
  url = "/archive/"
  weight = 5

[[main]]
  name = "tools"
  url = "/tools/"
  weight = 6

[[main]]
  name = "email"
  url = "/email/"
  weight = 7

[[main]]
  name = "about"
  url = "/about/"
  weight = 8
