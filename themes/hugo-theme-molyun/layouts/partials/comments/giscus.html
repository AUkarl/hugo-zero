{{- /* comments/giscus.html — Giscus 评论系统 */ -}}
<div id="giscus-container"></div>
<script>
(function() {
  var cfg = {
    repo: '{{ .cfg.giscus_repo }}',
    repoId: '{{ .cfg.giscus_repo_id }}',
    category: '{{ .cfg.giscus_category | default "Announcements" }}',
    categoryId: '{{ .cfg.giscus_category_id }}',
    mapping: '{{ .cfg.giscus_mapping | default "pathname" }}',
    label: '{{ .cfg.giscus_label | default "comment" }}',
    lang: '{{ if eq (string (.page.Language.Lang)) "zh" }}zh-CN{{ else }}en{{ end }}'
  };

  function getGiscusTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return 'dark';
    if (t === 'light') return 'light';
    return 'preferred_color_scheme';
  }

  function loadGiscus() {
    var container = document.getElementById('giscus-container');
    if (!container || container.querySelector('script[data-giscus]')) return;
    var script = document.createElement('script');
    script.src = 'https://giscus.app/client.js';
    script.setAttribute('data-giscus', '1');
    script.setAttribute('data-repo', cfg.repo);
    script.setAttribute('data-repo-id', cfg.repoId);
    script.setAttribute('data-category', cfg.category);
    script.setAttribute('data-category-id', cfg.categoryId);
    script.setAttribute('data-mapping', cfg.mapping);
    script.setAttribute('data-strict', '0');
    script.setAttribute('data-reactions-enabled', '1');
    script.setAttribute('data-emit-metadata', '0');
    script.setAttribute('data-input-position', 'bottom');
    script.setAttribute('data-theme', getGiscusTheme());
    script.setAttribute('data-lang', cfg.lang);
    script.crossOrigin = 'anonymous';
    script.async = true;
    container.appendChild(script);
  }

  function updateGiscusTheme() {
    var iframe = document.querySelector('iframe.giscus-frame');
    if (iframe) {
      iframe.contentWindow.postMessage({
        giscus: { setConfig: { theme: getGiscusTheme() } }
      }, 'https://giscus.app');
    }
  }

  loadGiscus();

  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      if (m.attributeName === 'data-theme') {
        updateGiscusTheme();
      }
    });
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
