{{- /*
  youtube.html — YouTube 视频嵌入短代码
  用法: {{< youtube "dQw4w9WgXcQ" >}}
  或:   {{< youtube id="dQw4w9WgXcQ" start="30" >}}
  支持: 视频 ID、开始时间、隐私增强模式
*/ -}}
{{- $id := .Get "id" | default (.Get 0) -}}
{{- $start := .Get "start" | default "" -}}
{{- $title := .Get "title" | default "YouTube video" -}}
<div class="video-embed youtube-embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ $id }}{{ if $start }}?start={{ $start }}{{ end }}"
    title="{{ $title }}"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
    loading="lazy"
    style="width:100%;aspect-ratio:16/9;height:auto;">
  </iframe>
</div>
