{{- /* ============================================================
  math.html — 数学公式支持
  按需加载 MathJax，支持 LaTeX 语法
  通过页面 front matter 的 math: true 或全局配置启用
  ============================================================ */ -}}
<script>
  /* MathJax 配置 — 支持行内 $...$ 和块级 $$...$$ 公式 */
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
