{{- /* ============================================================
  scroll-buttons.html — 回到顶部 / 到底部按钮
  根据滚动位置自动显隐（由 common.js 控制）
  ============================================================ */ -}}
<div class="scroll-buttons" id="scrollButtons">
  <button class="scroll-btn" id="scrollToTop" title="{{ i18n "scroll-top" | default "回到顶部" }}"><i class="fas fa-chevron-up"></i></button>
  <button class="scroll-btn" id="scrollToBottom" title="{{ i18n "scroll-bottom" | default "到底部" }}"><i class="fas fa-chevron-down"></i></button>
</div>
