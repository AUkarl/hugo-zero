{{- /*
  figure.html — 增强图片短代码
  用法: {{< figure src="image.jpg" alt="描述" caption="图片说明" link="https://..." target="_blank" class="wide" >}}
  支持: 图片标题、链接、自定义 CSS 类、懒加载
*/ -}}
<figure class="figure{{ with .Get "class" }} {{ . }}{{ end }}">
  <a {{ with .Get "link" }}href="{{ . }}"{{ end }} {{ with .Get "target" }}target="{{ . }}"{{ end }} {{ with .Get "rel" }}rel="{{ . }}"{{ end }}>
    <img src="{{ .Get "src" }}"
         {{ with .Get "alt" }}alt="{{ . }}"{{ else }}alt=""{{ end }}
         {{ with .Get "width" }}width="{{ . }}"{{ end }}
         {{ with .Get "height" }}height="{{ . }}"{{ end }}
         loading="lazy" />
  </a>
  {{- with .Get "caption" }}
  <figcaption class="figure-caption">{{ . }}</figcaption>
  {{- end }}
</figure>
